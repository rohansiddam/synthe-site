<title>Social card source</title>
<!-- Source for /og-image.png. Render at 1120x560 CSS px with device scale 2 against the local server
     (python3 tools/serve.py), so the self-hosted fonts and the site's tokens load:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1120,560 --force-device-scale-factor=2 --screenshot=og-image.png \
       http://localhost:8790/tools/og-image.html
     Two colors carry meaning: ink is the agent's half of the mark, coral is yours. The card uses the site's
     light tokens (--bg, --ink, --muted, --agent, --human) and the dark mode's status colors on the ink card. -->
<link rel="stylesheet" href="/site.css?v=27f2e1ec" />
<style>
  html, body { margin: 0; width: 1120px; height: 560px; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .card { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 424px; align-items: center; padding: 0 72px; gap: 56px; }
  .left { display: flex; flex-direction: column; height: 424px; justify-content: space-between; }
  .lockup { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 44px; line-height: 1; letter-spacing: -0.01em; }
  .lockup svg { width: 44px; height: 46px; flex: none; }
  h1 { margin: 0; font-weight: 600; font-size: 60px; line-height: 1.08; letter-spacing: -0.03em; }
  h1 span { color: var(--muted); }
  .cat { margin: 0; font-size: 24px; font-weight: 500; letter-spacing: -0.005em; color: var(--ink-soft); }
  .term { background: #1b1613; color: #f2eadf; padding: 28px 32px 36px; font-family: var(--mono); font-size: 22px; line-height: 1.9;
    clip-path: polygon(0 0, calc(100% - 28px) 0, 100% 37px, 100% 100%, 0 100%); }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; font-size: 16px; color: #ab9f92; line-height: 1; }
  .head svg { width: 22px; height: 23px; }
  .head svg .a { fill: #f2eadf; } .head svg .b { fill: #e06a57; }
  .row { display: grid; grid-template-columns: 112px 1fr; white-space: nowrap; }
  .ok { color: #8fc9a0; font-weight: 500; }
  .no { color: #e06a57; font-weight: 500; }
  .dim { color: #ab9f92; }
</style>
</head>
