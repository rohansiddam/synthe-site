<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>Social card source</title>
<!-- Source for /og-image.png. Render at 1120x560 CSS px with device scale 2 against the local server
     (python3 tools/serve.py), so the self-hosted fonts and the site's tokens load:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1120,560 --force-device-scale-factor=2 --screenshot=og-image.png \
       http://localhost:8790/tools/og-image.html
     The card matches the homepage: paper, ink, gold only as a marker, and an example prompt report. -->
<link rel="stylesheet" href="/site.css?v=acea6bda" />
<style>
  html, body { margin: 0; width: 1120px; height: 560px; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .card { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 400px; align-items: center; padding: 0 72px; gap: 48px; }
  .left { display: flex; flex-direction: column; height: 416px; justify-content: space-between; }
  .lockup { display: flex; align-items: center; gap: 12px; font-family: var(--wordmark); font-weight: 500; font-size: 36px; line-height: 1; }
  .lockup .mark { width: 34px; height: 36px; }
  h1 { margin: 0; font-size: 72px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 500 !important; }
  .cat { margin: 0; font-size: 24px; color: var(--muted); }
  .panel { position: relative; border-radius: 24px; background: #f1ede2; padding: 32px 28px 0; height: 416px; box-sizing: border-box; overflow: hidden; }
  .panel::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(23, 20, 16, .14) 1px, transparent 1.5px); background-size: 16px 16px;
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 85% 0%, #000 0, transparent 70%); mask-image: radial-gradient(ellipse 80% 70% at 85% 0%, #000 0, transparent 70%); }
  .report { position: relative; background: var(--card); border-radius: 16px 16px 0 0; box-shadow: 0 0 0 1px var(--line), 0 32px 64px -32px rgba(23, 20, 16, .28); height: 100%; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-bottom: 1px solid var(--line); font: 15px var(--mono); color: var(--muted); }
  .tab i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .tab .tag { margin-left: auto; font: 500 13px var(--sans); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .body { padding: 20px; display: grid; gap: 12px; }
  .body h2 { margin: 0 0 4px; font-size: 22px; font-weight: 600 !important; letter-spacing: -0.01em; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--bg); font-size: 17px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; flex: none; font: 500 14px var(--sans); border-radius: 999px; padding: 3px 10px; }
  .kept { background: var(--ink); color: var(--bg); }
  .kept::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold-fill); }
  .no { border: 1px solid var(--line2); color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="left">
      <div class="lockup"><svg class="mark" viewBox="0 0 275 290" aria-hidden="true"><path class="half a" d="M 137.089 36.089 L 121.248 56.837 65.850 129.267 74.001 201.107 C 75.025 210.118 69.339 218.084 60.498 219.675 51.929 221.178 43.437 215.697 41.616 206.835 L 32.573 126.506 C 32.187 123.074 32.649 118.958 34.819 116.127 L 84.936 50.749 115.553 10.674 C 118.873 6.328 123.405 3.381 129.084 3.381 L 199.032 3.381 C 205.962 3.382 211.797 8.026 213.985 14.448 215.933 20.150 214.783 26.111 211.010 30.731 L 94.495 182.341 89.217 135.584 146.096 61.503 165.499 36.165 Z"/><path class="half b" d="M 137.911 253.913 L 153.752 233.165 209.151 160.735 200.999 88.895 C 199.976 79.884 205.661 71.918 214.503 70.327 223.072 68.824 231.564 74.305 233.384 83.167 L 242.427 163.496 C 242.814 166.928 242.352 171.044 240.182 173.875 L 190.065 239.253 159.448 279.328 C 156.127 283.674 151.595 286.621 145.916 286.621 L 75.968 286.621 C 69.039 286.620 63.204 281.976 61.016 275.554 59.067 269.852 60.218 263.891 63.991 259.271 L 180.506 107.661 185.784 154.418 128.905 228.499 109.501 253.837 Z"/></svg>Synthe</div>
      <h1>Your AI agent gets better on its own.</h1>
      <p class="cat">Self-improving AI agents · open source</p>
    </div>
    <div class="panel" aria-hidden="true">
      <div class="report">
        <div class="tab"><i></i><i></i><i></i>&nbsp;Prompt report<span class="tag">Example</span></div>
        <div class="body">
          <h2>Your prompt got better.</h2>
          <div class="row"><span class="chip kept">kept</span><span>Offer an exchange before a refund</span></div>
          <div class="row"><span class="chip kept">kept</span><span>Don't guess about returns</span></div>
          <div class="row"><span class="chip no">not kept</span><span>Add a summary to every reply</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
