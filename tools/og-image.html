<!doctype html>

<title>Social card source</title>
<!-- Source for /og-image.png. Render at 1120x560 CSS px with device scale 2 against the local server
     (python3 tools/serve.py), so the self-hosted fonts and the site's tokens load:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1120,560 --force-device-scale-factor=2 --screenshot=og-image.png \
       http://127.0.0.1:8791/tools/og-image.html
     The card matches the homepage: paper, ink, approved brick red, and a labelled example prompt report. -->
<link rel="stylesheet" href="/site.css?v=0050023f" />
<style>
  html, body { margin: 0; width: 1120px; height: 560px; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .card { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 360px; align-items: center; padding: 0 72px; gap: 48px; box-sizing: border-box; }
  .left { display: flex; flex-direction: column; height: 416px; justify-content: space-between; }
  .lockup { display: flex; align-items: center; gap: 12px; font-family: var(--wordmark); font-weight: 500; font-size: 32px; line-height: 1; }
  .lockup .mark { width: 32px; height: 34px; }
  h1 { margin: 0; font-size: 64px; line-height: 1.04; letter-spacing: -.025em; font-weight: 500 !important; }
  .cat { margin: 0; font-size: 20px; color: var(--muted); }
  .panel { border: 1px solid var(--line); border-radius: 10px; background: var(--bg2); padding: 28px; height: 416px; box-sizing: border-box; }
  .label { display: flex; justify-content: space-between; gap: 16px; font: 12px var(--mono); color: var(--muted); margin: 0 0 32px; }
  h2 { margin: 0 0 32px; font-size: 24px; line-height: 1.15; font-weight: 500; max-width: 14ch; }
  .row { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 16px 0; border-top: 1px solid var(--line2); font-size: 16px; line-height: 1.4; }
  .state { font: 12px/1.8 var(--mono); color: var(--accent-text); }
  .state.no { color: var(--muted); }
</style>
</head>

      <h1>Your AI agent gets better on its own.</h1>
      <p class="cat">Self-improving AI agents · open source</p>
    </div>
    <div class="panel">
      <p class="label"><span>Prompt report</span><span>Example</span></p>
